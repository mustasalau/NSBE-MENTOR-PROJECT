name: 🧪 Test Scrapers

on:
  # Run on pushes to main that affect scraper files
  push:
    branches: [ main ]
    paths:
      - 'Scraper/**'
      - '.github/workflows/**'
      
  # Allow manual testing
  workflow_dispatch:

jobs:
  test-scrapers:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🔧 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r Scraper/requirements.txt
          
      - name: 🔧 Install Node.js dependencies
        run: npm install
          
      - name: 🌐 Install browsers for Selenium
        run: |
          # Install Chrome/Chromium
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          
          # Install Firefox
          sudo apt-get install -y firefox
          
          # Install GeckoDriver manually (firefox-geckodriver package doesn't exist)
          GECKODRIVER_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          echo "Installing GeckoDriver version: $GECKODRIVER_VERSION"
          wget -q https://github.com/mozilla/geckodriver/releases/download/$GECKODRIVER_VERSION/geckodriver-$GECKODRIVER_VERSION-linux64.tar.gz
          tar -xzf geckodriver-$GECKODRIVER_VERSION-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/geckodriver
          rm geckodriver-$GECKODRIVER_VERSION-linux64.tar.gz
          
          echo "✅ Browser installation complete"
          
      - name: 🔧 Setup WebDrivers  
        run: |
          # Create symlinks for chromedriver access
          sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver || true
          sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/bin/chromedriver || true
          
          # Create symlinks for geckodriver access  
          sudo ln -sf /usr/local/bin/geckodriver /usr/bin/geckodriver || true
          
          # Make sure drivers are executable
          sudo chmod +x /usr/lib/chromium-browser/chromedriver || true
          sudo chmod +x /usr/local/bin/geckodriver || true
          
          # Verify installations
          echo "ChromeDriver version: $(chromedriver --version 2>/dev/null || echo 'Not found')"
          echo "GeckoDriver version: $(geckodriver --version 2>/dev/null || echo 'Not found')"
          echo "Firefox version: $(firefox --version 2>/dev/null || echo 'Not found')"
          echo "Chromium version: $(chromium-browser --version 2>/dev/null || echo 'Not found')"
          
          echo "✅ WebDriver setup complete"
          
      - name: 🧪 Test clubs scraper and merge
        run: |
          echo "🧪 Testing clubs scraper..."
          echo "🔍 Environment info:"
          echo "  Chrome version: $(google-chrome --version 2>/dev/null || chromium-browser --version 2>/dev/null || echo 'Not found')"
          echo "  Firefox version: $(firefox --version 2>/dev/null || echo 'Not found')"
          echo "  Chrome/Chromium locations:"
          echo "    /snap/bin/chromium: $(test -f /snap/bin/chromium && echo 'Found' || echo 'Not found')"
          echo "    /usr/bin/chromium-browser: $(test -f /usr/bin/chromium-browser && echo 'Found' || echo 'Not found')"
          echo "    /opt/google/chrome/google-chrome: $(test -f /opt/google/chrome/google-chrome && echo 'Found' || echo 'Not found')"
          echo "    /usr/bin/google-chrome: $(test -f /usr/bin/google-chrome && echo 'Found' || echo 'Not found')"
          echo "    /usr/bin/google-chrome-stable: $(test -f /usr/bin/google-chrome-stable && echo 'Found' || echo 'Not found')"
          echo "  Firefox locations:"
          echo "    /usr/bin/firefox: $(test -f /usr/bin/firefox && echo 'Found' || echo 'Not found')"
          echo "    /usr/bin/firefox-esr: $(test -f /usr/bin/firefox-esr && echo 'Found' || echo 'Not found')"
          echo "    /snap/bin/firefox: $(test -f /snap/bin/firefox && echo 'Found' || echo 'Not found')"
          echo "  ChromeDriver version: $(chromedriver --version 2>/dev/null || echo 'Not found')"
          echo "  ChromeDriver location: $(which chromedriver 2>/dev/null || echo 'Not found')"
          echo "  GeckoDriver version: $(geckodriver --version 2>/dev/null || echo 'Not found')"
          echo "  GeckoDriver location: $(which geckodriver 2>/dev/null || echo 'Not found')"
          echo "  CI environment: $CI"
          echo "  GitHub Actions: $GITHUB_ACTIONS"
          echo "  Temp directories:"
          echo "    /tmp: $(test -d /tmp && echo 'Exists, writable: '$(test -w /tmp && echo 'Yes' || echo 'No') || echo 'Not found')"
          echo "    /dev/shm: $(test -d /dev/shm && echo 'Exists, writable: '$(test -w /dev/shm && echo 'Yes' || echo 'No') || echo 'Not found')"
          echo "  Chrome processes: $(pgrep -f chrome | wc -l) running"
          echo "  Available disk space: $(df -h /tmp | tail -1 | awk '{print $4}') in /tmp"
          
          cd Scraper
          timeout 300s python3 scraper.py || echo "⚠️ Clubs scraper test completed"
          
          echo "🧪 Testing clubs data merge..."
          cd ..
          if [ -f "Scraper/psu_organizations.json" ]; then
            echo "✅ Python scraper output found"
            node src/utils/mergeClubs.cjs || echo "⚠️ Merge test completed"
          else
            echo "❌ Python scraper output not found"
          fi
          
      - name: 🧪 Test majors scraper  
        run: |
          echo "🧪 Testing majors scraper..."
          cd Scraper
          timeout 300s python3 majorScraper.py || echo "⚠️ Majors scraper test completed"
