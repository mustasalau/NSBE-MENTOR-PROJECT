name: 🎓 Annual Data Update

on:
  # Automatically run on May 1st every year at 9 AM UTC
  schedule:
    - cron: '0 9 1 5 *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      update_type:
        description: 'What to update'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - clubs-only
          - majors-only

env:
  # Ensure we're in production mode for path handling
  NODE_ENV: production

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Allow pushing changes back to repo
      
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🔧 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r Scraper/requirements.txt
          
      - name: 🔧 Install Node.js dependencies
        run: npm install
        
      - name: 🌐 Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          
      - name: 🔧 Setup ChromeDriver  
        run: |
          # Install ChromeDriver using apt (simpler and more reliable)
          sudo apt-get update
          sudo apt-get install -y chromium-chromedriver
          
          # Create symlink if needed
          sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver || true
          
          echo "✅ ChromeDriver setup complete"
          
      - name: 🕷️ Run scrapers and update data
        run: |
          echo "🎓 Starting annual data update..."
          echo "📅 Date: $(date)"
          
          if [[ "${{ github.event.inputs.update_type }}" == "clubs-only" ]]; then
            echo "📚 Updating clubs only..."
            npm run scrape-clubs
            npm run update-clubs-only
          elif [[ "${{ github.event.inputs.update_type }}" == "majors-only" ]]; then
            echo "🎓 Updating majors only..."
            npm run scrape-majors
            npm run update-majors-only
          else
            echo "📚🎓 Updating both clubs and majors..."
            npm run update-data
          fi
          
      - name: 📊 Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📈 Changes detected!"
            git status --short
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "📭 No changes detected"
          fi
          
      - name: 📝 Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Add only the data files and backups
          git add src/data/clubs.json src/data/majors.json
          git add src/data/*backup*.json 2>/dev/null || true
          
          # Create commit message with details
          COMMIT_MSG="🎓 Annual data update - $(date +'%Y-%m-%d')"
          
          git commit -m "$COMMIT_MSG"
          git push
          
      - name: 📋 Create summary
        if: always()
        run: |
          echo "## 🎓 Annual Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.check_changes.outputs.changes }}" == "true" ]]; then
            echo "**Status:** ✅ Data updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** 📭 No changes needed" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: 🚨 Handle errors
        if: failure()
        run: |
          echo "## ❌ Annual Data Update Failed" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Error:** The workflow failed during execution" >> $GITHUB_STEP_SUMMARY
